name: CineJoy bridge compile check
on:
  push:
    branches: [cinejoy-integration-test]
  pull_request:
    branches: [bingebang-test]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated CineJoy bridge (no deployment)
        run: docker build -f experiments/cinejoy-bridge/Dockerfile -t cinejoy-bridge-prototype .
      - name: Probe CineJoy upstream status (no decoder execution)
        shell: bash
        timeout-minutes: 1
        run: |
          for path in crush.wasm servers; do
            code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://api.shegu.st/$path" || true)
            echo "CineJoy endpoint $path: HTTP ${code:-000}"
          done
      - name: Smoke-test CineJoy resolution (TMDB 361743)
        shell: bash
        timeout-minutes: 3
        run: |
          docker run -d --name cinejoy-smoke cinejoy-bridge-prototype
          sleep 3
          set +e
          docker exec cinejoy-smoke sh -c 'wget -S -T 100 -O /tmp/response.json "http://127.0.0.1:8788/resolve?tmdb=361743"'
          rc=$?
          echo "Resolver exit code: $rc"
          docker logs cinejoy-smoke 2>&1 | sed -E 's@https?://[^ ]+@[URL_REDACTED]@g'
          if [ "$rc" -ne 0 ]; then
            echo "CineJoy resolver failed"
            exit 1
          fi
          docker exec cinejoy-smoke grep -q '"url"' /tmp/response.json
