name: MovieBox eighth provider build check
on:
  push:
    branches: [moviebox-eighth-provider]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build integrated FMHY with MovieBox eighth provider
        run: node scripts/build-fmhy-integrated.js
